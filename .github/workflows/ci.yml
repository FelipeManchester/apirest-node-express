name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Container efêmero do runner, destruído no fim do job e sem porta
          # exposta para fora dele. Não é credencial de lugar nenhum.
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Instalar o node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar o .env.test
        # O .env.test não é versionado (contém credencial). O CI monta o dele,
        # com um JWT_SECRET novo a cada execução.
        run: |
          cat > .env.test <<EOF
          DATABASE_URL=postgresql://postgres:postgres_ci@localhost:5432/estudo_test
          JWT_SECRET=$(node -pe "require('crypto').randomBytes(32).toString('hex')")
          CORS_ORIGINS=http://localhost:5173
          NODE_ENV=test
          EOF

      - name: Lint
        run: npm run lint

      - name: testes
        run: npm test
