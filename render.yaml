services:
  - type: web
    name: studio-fit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: COOKIE_CROSS_SITE
        value: 'true'
